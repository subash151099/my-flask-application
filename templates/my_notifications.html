{% extends "base.html" %}{% block title %}My Notifications | Irumanam{% endblock %}{% block content %}<div class="container py-4" style="max-width:850px"><h1 class="h3 fw-bold mb-4">Payment & Account Notifications</h1><div class="dashboard-card p-0">{% for n in items %}<div class="p-3 border-bottom"><div>{{ n['message'] }}</div><small class="text-secondary">{{ n['created_at'] }}</small></div>{% else %}<div class="p-4 text-center text-secondary">You have no notifications.</div>{% endfor %}</div><a class="btn btn-outline-secondary mt-3" href="{{ url_for('premium_page') }}">Back to Premium</a></div>{% endblock %}
